.w-ctl { stroke:#7d8695; stroke-dasharray:5 4; stroke-width:1.3; }
.d-data { fill:#20272f; } .d-fwd { fill:#2361c9; } .d-red { fill:#c2413b; }
.d-csr { fill:#7b3fbf; } .d-ctl { fill:#7d8695; }
.ahf-data { fill:#20272f; } .ahf-fwd { fill:#2361c9; } .ahf-red { fill:#c2413b; }

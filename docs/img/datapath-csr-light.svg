.t-fwdl { font-size:10.5px; fill:#2361c9; }
.t-redl { font-size:10.5px; fill:#c2413b; }
.t-csrl { font-size:10.5px; fill:#7b3fbf; }
</style><defs><marker id="ah-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf-data"/></marker><marker id="ah-fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf-fwd"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf-red"/></marker><marker id="ah-csr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf-csr"/></marker><marker id="ah-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf-ctl"/></marker></defs><polyline points="244,152 280,152" class="w-csr"/><polyline points="244,174 280,174" class="w-csr"/><polyline points="244,196 280,196" class="w-csr"/><polyline points="244,218 280,218" class="w-csr"/><polyline points="244,264 280,264" class="w-csr"/><polyline points="244,292 280,292" class="w-csr"/><polyline points="302,186 316,186 316,370" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="302,278 330,278 330,340 330,370" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="430,396 486,396 486,824 580,824" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="715,300 715,185 760,185" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="782,185 1090,185" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="1134,185 1160,185" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="1204,185 1230,185" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="1274,185 1330,185" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="840,330 1104,330 1104,222" class="w-red" marker-end="url(#ah-red)"/><polyline points="840,366 1118,366 1118,222" class="w-red" marker-end="url(#ah-red)"/><polyline points="840,624 1140,624" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="1040,470 1140,470" class="w-ctl" marker-end="url(#ah-ctl)"/><polyline points="240,808 256,808 256,886 441,886 441,868" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="500,762 441,762 441,772" class="w-ctl" marker-end="url(#ah-ctl)"/><polyline points="452,820 560,820 560,794 580,794" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="486,708 591,708 591,780" class="w-ctl" marker-end="url(#ah-ctl)"/><polyline points="486,742 711,742 711,788" class="w-ctl" marker-end="url(#ah-ctl)"/><polyline points="602,810 660,810 660,800 700,800" class="w-csr" marker-end="url(#ah-csr)"/><polyline points="722,816 770,816 770,704" class="w-csr" marker-end="url(#ah-csr)"/><rect x="40" y="60" width="400" height="280" rx="6" class="node"/><rect x="280" y="140" width="22" height="92" rx="11.0" class="node mux"/><rect x="280" y="250" width="22" height="56" rx="11.0" class="node mux"/><rect x="120" y="370" width="310" height="52" rx="6" class="node"/><rect x="560" y="60" width="480" height="640" rx="6" class="node csrbox"/><rect x="760" y="110" width="22" height="150" rx="11.0" class="node mux"/><rect x="590" y="300" width="250" height="30" rx="4" class="node"/><rect x="590" y="336" width="250" height="30" rx="4" class="node"/><rect x="590" y="372" width="250" height="30" rx="4" class="node"/><rect x="590" y="408" width="250" height="30" rx="4" class="node"/><rect x="590" y="444" width="250" height="30" rx="4" class="node"/><rect x="590" y="480" width="250" height="30" rx="4" class="node"/><rect x="590" y="516" width="250" height="30" rx="4" class="node"/><rect x="590" y="552" width="250" height="30" rx="4" class="node"/><rect x="590" y="588" width="250" height="30" rx="4" class="node"/><rect x="590" y="624" width="250" height="30" rx="4" class="node"/><rect x="1090" y="150" width="44" height="70" rx="4" class="node pipereg"/><rect x="1160" y="150" width="44" height="70" rx="4" class="node pipereg"/><rect x="1230" y="150" width="44" height="70" rx="4" class="node pipereg"/><rect x="40" y="780" width="200" height="64" rx="6" class="node"/><rect x="430" y="772" width="22" height="96" rx="11.0" class="node mux"/><rect x="580" y="780" width="22" height="60" rx="11.0" class="node mux"/><rect x="700" y="788" width="22" height="56" rx="11.0" class="node mux"/><circle cx="486" cy="708" r="3.4" class="d-csr"/><circle cx="486" cy="742" r="3.4" class="d-csr"/><text x="240.0" y="84" class="t-box" text-anchor="middle">EX：trap 產生（branch unit 內）</text><text x="240.0" y="98" class="t-tiny" text-anchor="middle">來源：ecall（L1851）・illegal CSR（L1863）</text><text x="240.0" y="110" class="t-tiny" text-anchor="middle">misaligned load/store（L1867-94）・mret（L1854）</text><text x="291.0" y="173.0" class="t-mux" text-anchor="middle">M</text><text x="291.0" y="186.0" class="t-mux" text-anchor="middle">u</text><text x="291.0" y="199.0" class="t-mux" text-anchor="middle">x</text><text x="291.0" y="134" class="t-mid" text-anchor="middle">M3a</text><text x="316" y="150" class="t-csrl" text-anchor="start">cause</text><text x="240" y="155" class="t-tiny" text-anchor="end">ecall→8/9/11・依 priv（L1906-10）</text><text x="240" y="177" class="t-tiny" text-anchor="end">illegal CSR→2（L1924）</text><text x="240" y="199" class="t-tiny" text-anchor="end">mis-load→4（L1949）</text><text x="240" y="221" class="t-tiny" text-anchor="end">mis-store→6（L1955）</text><text x="291.0" y="244" class="t-mid" text-anchor="middle">M3b</text><text x="316" y="260" class="t-csrl" text-anchor="start">tval</text><text x="240" y="267" class="t-tiny" text-anchor="end">0（L1911/1925）</text><text x="240" y="295" class="t-tiny" text-anchor="end">ex_alu_out（L1950/56）</text><text x="56" y="328" class="t-tiny" text-anchor="start">trap_pc＝ex_pc（L1904…；RTL 預設 0 僅 trap 臂賦值，經 fire 閘控後等同直連）</text><text x="275.0" y="390" class="t-box" text-anchor="middle">脈衝閘：*_fire ＝∧ ex_mem_Write</text><text x="275.0" y="402" class="t-tiny" text-anchor="middle">L2633-34（stall 期間不重複觸發副作用）</text><text x="478" y="560" class="t-csrl" text-anchor="end">ex_trap_take_fire・ex_trap_mret_fire</text><text x="478" y="576" class="t-csrl" text-anchor="end">＋ ex_trap_cause／tval／pc（值）</text><text x="800.0" y="84" class="t-box" text-anchor="middle">csr_file（L625-890）</text><text x="771.0" y="172.0" class="t-mux" text-anchor="middle">M</text><text x="771.0" y="185.0" class="t-mux" text-anchor="middle">u</text><text x="771.0" y="198.0" class="t-mux" text-anchor="middle">x</text><text x="771.0" y="104" class="t-mid" text-anchor="middle">M24</text><text x="782" y="128" class="t-tiny" text-anchor="start">閘：opcode=0x73 ∧ funct3≠0（L735）</text><text x="782" y="252" class="t-tiny" text-anchor="start">default → is_illegal_csr（L751）</text><text x="700" y="276" class="t-tiny" text-anchor="middle">讀 mux L732-56（unique case id_inst[31:20]）</text><text x="600" y="319" class="t-sig" text-anchor="start">mstatus 0x300</text><text x="1010" y="319" class="t-tiny" text-anchor="end">L649・mask L710・legalize L712</text><text x="600" y="355" class="t-sig" text-anchor="start">mtvec 0x305</text><text x="1010" y="355" class="t-tiny" text-anchor="end">L650・[1:0]=00</text><text x="600" y="391" class="t-sig" text-anchor="start">mepc 0x341</text><text x="1010" y="391" class="t-tiny" text-anchor="end">L651・bit0=0</text><text x="600" y="427" class="t-sig" text-anchor="start">mcause 0x342</text><text x="1010" y="427" class="t-tiny" text-anchor="end">L652</text><text x="600" y="463" class="t-sig" text-anchor="start">mtval 0x343</text><text x="1010" y="463" class="t-tiny" text-anchor="end">L653</text><text x="600" y="499" class="t-sig" text-anchor="start">mhartid 0xF14</text><text x="1010" y="499" class="t-tiny" text-anchor="end">L654・唯讀</text><text x="600" y="535" class="t-sig" text-anchor="start">mie 0x304 / mideleg 0x303</text><text x="1010" y="535" class="t-tiny" text-anchor="end">L656-57</text><text x="600" y="571" class="t-sig" text-anchor="start">pmpcfg0 0x3A0 / pmpaddr0 0x3B0</text><text x="1010" y="571" class="t-tiny" text-anchor="end">L660-61</text><text x="600" y="607" class="t-sig" text-anchor="start">medeleg / satp / stvec</text><text x="1010" y="607" class="t-tiny" text-anchor="end">讀＝illegal（L743/746/747）・寫臂不可達</text><text x="600" y="643" class="t-sig" text-anchor="start">priv_mode（2b，非 CSR）</text><text x="1010" y="643" class="t-tiny" text-anchor="end">L670・reset=M</text><text x="600" y="685" class="t-tiny" text-anchor="start">無 mip・mscratch・misa・任何 counter CSR；mnstatus 刻意不實作（L662-63）</text><text x="710" y="242" class="t-csrl" text-anchor="end">10 組暫存器值（讀取臂）</text><text x="830" y="178" class="t-csrl" text-anchor="start">csr_read_data（ID 段讀出）</text><text x="1116" y="197" class="t-tiny" text-anchor="middle" transform="rotate(-90 1116 197)">ID/EX</text><text x="1186" y="197" class="t-tiny" text-anchor="middle" transform="rotate(-90 1186 197)">EX/MEM</text><text x="1256" y="197" class="t-tiny" text-anchor="middle" transform="rotate(-90 1256 197)">MEM/WB</text><text x="1336" y="178" class="t-csrl" text-anchor="start">wb_csr_read_data</text><text x="1336" y="192" class="t-csrl" text-anchor="start">→ 圖 1 M23</text><text x="1150" y="258" class="t-redl" text-anchor="start">mtvec/mepc → ID/EX → EX branch unit → PC（圖 1 紅線）</text><text x="1150" y="618" class="t-csrl" text-anchor="start">priv_mode 當前值 → branch unit（L2620）</text><text x="1150" y="458" class="t-ctl" text-anchor="start">is_illegal_csr ∨ 編碼檢查（csr_control_unit L950）</text><text x="1150" y="472" class="t-ctl" text-anchor="start">＝OR 合併（L2773）→ ID/EX → EX trap（cause=2）</text><text x="40" y="730" class="t-box" text-anchor="start">寫入路徑：WB 段執行（L3035-38）</text><text x="40" y="750" class="t-tiny" text-anchor="start">0x73 全序列化・drain 完才發射 → ID 讀・WB 寫一致（L2033-56）</text><text x="140.0" y="800" class="t-box" text-anchor="middle">寫入資料（來自圖 1）</text><text x="140.0" y="813" class="t-tiny" text-anchor="middle">wb_reg_write_data（L3037）</text><text x="140.0" y="824" class="t-tiny" text-anchor="middle">運算元 rs1/zimm 由 EX M11 選</text><text x="441.0" y="807.0" class="t-mux" text-anchor="middle">M</text><text x="441.0" y="820.0" class="t-mux" text-anchor="middle">u</text><text x="441.0" y="833.0" class="t-mux" text-anchor="middle">x</text><text x="441.0" y="766" class="t-mid" text-anchor="middle">M25</text><text x="424" y="790" class="t-tiny" text-anchor="end">hold（default L764）</text><text x="424" y="812" class="t-tiny" text-anchor="end">csrrw：= wd（L780-95）</text><text x="424" y="834" class="t-tiny" text-anchor="end">csrrs：|= wd（L796-811）</text><text x="424" y="856" class="t-tiny" text-anchor="end">csrrc：&amp;= ~wd（L812-27）</text><text x="268" y="800" class="t-csrl" text-anchor="start">wd</text><text x="506" y="766" class="t-ctl" text-anchor="start">sel＝wb_CsrWrite・wb_csr_funct3（L3035-38）</text><text x="300" y="900" class="t-tiny" text-anchor="start">M25 寫入 op（×12 同構；mhartid 唯讀）L763-852</text><text x="302" y="926" class="t-tiny" text-anchor="start">mstatus 僅 csrrw 臂經 legalize/mask（L786）；csrrs/csrrc 直寫（L802/818，FIXME）</text><text x="591.0" y="797.0" class="t-mux" text-anchor="middle">M</text><text x="591.0" y="810.0" class="t-mux" text-anchor="middle">u</text><text x="591.0" y="823.0" class="t-mux" text-anchor="middle">x</text><text x="591.0" y="853" class="t-tiny" text-anchor="middle">trap override L832-42</text><text x="584" y="797.2" class="t-port">0</text><text x="584" y="827.2" class="t-port">1</text><text x="704" y="803.2" class="t-port">0</text><text x="704" y="831.2" class="t-port">1</text><text x="711" y="862" class="t-tiny" text-anchor="middle">mret override L843-51</text><text x="494" y="722" class="t-ctl" text-anchor="start">ex_trap_take_fire（sel）</text><text x="718" y="752" class="t-ctl" text-anchor="start">ex_trap_mret_fire（sel）</text><text x="780" y="722" class="t-csrl" text-anchor="start">*_n → 暫存器（posedge，L855-89）</text><text x="470" y="946" class="t-tiny" text-anchor="start">trap：mepc←trap_pc（bit0=0）・mcause←cause・mtval←tval・MPIE←MIE・MIE←0・MPP←priv・priv←M</text><text x="470" y="964" class="t-tiny" text-anchor="start">mret：priv←MPP・MIE←MPIE・MPIE←1・MPP←M（L850，FIXME：spec 應為 U）</text><text x="66" y="1000" class="t-box" text-anchor="start">無任何 interrupt 接線：mie／mstatus.MIE 只是可寫位元；mcause bit63 永不設置；無 CLINT／mtime。</text></svg>